name: CI Pipeline - Microservices Lab

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x user-service/mvnw

      - name: Run Unit Tests
        run: |
          cd user-service
          ./mvnw clean test

      - name: Package Spring Boot Application
        run: |
          cd user-service
          ./mvnw package -DskipTests

      - name: Build Backend Container Image
        run: |
          cd user-service
          docker build -t user-service:${{ github.sha }} -t user-service:latest -f Containerfile .

  frontend-ci:
    name: Build & Test Frontend (Vue.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Vue Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Build Frontend Container Image
        run: |
          cd frontend
          docker build -t frontend:${{ github.sha }} -t frontend:latest -f Containerfile .

  k8s-validation:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests with Kubeconform
        uses: yannh/kubeconform-action@v0.3.2
        with:
          files: 'k8s/*.yaml'
          kubernetes_version: '1.30.0'
          summary: true
